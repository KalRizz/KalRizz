<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Haekal Rizqi's Python learning orbit</title>
  <desc id="desc">A warm orbital illustration with Python, Git, and problem solving around a central learning node.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b2b"/>
      <stop offset="1" stop-color="#0b1718"/>
    </linearGradient>
    <radialGradient id="core" cx="45%" cy="38%">
      <stop offset="0" stop-color="#f7d794"/>
      <stop offset="1" stop-color="#d98b5f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="360" rx="20" fill="url(#background)"/>
  <path d="M0 290C180 250 230 335 415 287S700 220 900 273V360H0Z" fill="#203d38" opacity=".55"/>
  <g fill="#f7d794" opacity=".75">
    <circle cx="82" cy="72" r="2"/><circle cx="176" cy="282" r="2"/><circle cx="766" cy="74" r="2"/><circle cx="830" cy="218" r="2"/><circle cx="692" cy="300" r="1.5"/>
  </g>
  <g transform="translate(450 180)" fill="none" stroke="#8ec5a5" stroke-width="2" opacity=".72">
    <ellipse rx="260" ry="92" transform="rotate(-12)"/>
    <ellipse rx="205" ry="70" transform="rotate(34)"/>
    <ellipse rx="145" ry="52" transform="rotate(78)"/>
  </g>
  <g transform="translate(450 180)" filter="url(#glow)">
    <circle r="54" fill="#d98b5f" opacity=".22"/>
    <circle r="38" fill="url(#core)" stroke="#ffe8ae" stroke-width="2"/>
    <path d="M-17-5c0-13 8-22 21-22 10 0 17 5 21 13-5-3-10-4-15-4-7 0-11 4-11 10 0 8 7 12 15 12 5 0 10-1 14-3-4 12-13 20-26 20-13 0-19-9-19-26Z" fill="#17302f"/>
    <circle cx="-3" cy="-12" r="3" fill="#f7d794"/>
  </g>
  <g font-family="Georgia, serif" fill="#fff4d6">
    <text x="44" y="58" font-size="25" font-weight="bold">learning in orbit</text>
    <text x="44" y="87" font-family="Arial, sans-serif" font-size="14" fill="#b6d4bf">small steps, useful tools, thoughtful code</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <g transform="translate(190 98)"><rect x="-52" y="-20" width="104" height="40" rx="20" fill="#f7d794"/><text y="5" fill="#17302f">PYTHON</text></g>
    <g transform="translate(710 110)"><rect x="-43" y="-20" width="86" height="40" rx="20" fill="#8ec5a5"/><text y="5" fill="#17302f">GIT</text></g>
    <g transform="translate(705 260)"><rect x="-83" y="-20" width="166" height="40" rx="20" fill="#d98b5f"/><text y="5" fill="#fff4d6">PROBLEM SOLVING</text></g>
    <g transform="translate(194 258)"><rect x="-63" y="-20" width="126" height="40" rx="20" fill="#b6d4bf"/><text y="5" fill="#17302f">CURIOSITY</text></g>
  </g>
</svg>
